version: 2
updates:
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      cooldown:
          default-days: 7

    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      cooldown:
          default-days: 7
      groups:
          wordpress-packages:
              patterns:
                  - '@wordpress/*'
      ignore:
          # WordPress core still ships React 18: React 19 was reverted from 7.1
          # and is experimental in Gutenberg 23.4+, so @types/react must stay on
          # v18 to describe the React that core actually serves at runtime. This
          # plugin enqueues against wp-element rather than bundling React.
          # https://make.wordpress.org/core/2026/05/27/react-19-upgrade-in-wordpress/
          #
          # The original reason -- @wordpress/* peer-depending on @types/react
          # ^18.3.27 -- no longer applies; those packages now accept ^18 || ^19.
          #
          # REVISIT when React 19 actually lands in a core release this plugin
          # supports.
          - dependency-name: '@types/react'
            update-types:
                - version-update:semver-major
          # TypeScript uses a side-by-side layout: '@typescript/native' aliases
          # typescript@7 to supply `tsc`, while 'typescript' aliases
          # '@typescript/typescript6' to supply the TypeScript 6 API that
          # typescript-eslint still embeds. TypeScript 7.0 ships no programmatic
          # API, and typescript-eslint refuses to load against it, so a plain
          # bump to typescript@7 breaks `npm run lint:js`. Full rationale:
          # https://github.com/westonruter/post-date-modified/pull/96
          #
          # Dependabot already skips any requirement beginning with 'npm:', so
          # these produce no pull requests either way. Listing them makes the
          # suppression explicit rather than an invisible parser behavior, and
          # keeps it stable if that behavior ever changes.
          #
          # REVISIT when typescript-eslint supports TypeScript 7:
          # https://github.com/typescript-eslint/typescript-eslint/issues/10940
          # Both aliases then collapse back to a plain 'typescript' dependency,
          # and these two entries must be deleted along with them -- left
          # behind, they would silently suppress the very updates they were
          # added to explain.
          - dependency-name: 'typescript'
          - dependency-name: '@typescript/native'

    - package-ecosystem: composer
      directory: '/'
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      cooldown:
          default-days: 7
      groups:
          phpstan-packages:
              patterns:
                  - 'phpstan/*'
          wp-cli-packages:
              patterns:
                  - 'wp-cli/*'
